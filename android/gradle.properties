org.gradle.jvmargs=-Xmx4096M
android.useAndroidX=true
android.enableJetifier=true
# Flutter engine artifacts already use AndroidX. Jetifying their large debug
# JARs can exhaust Gradle's heap on unsigned CI builds.
android.jetifier.ignorelist=bcprov-jdk15on-1.68.jar,(arm64_v8a|armeabi_v7a|x86|x86_64)_debug-.*[.]jar
android.defaults.buildfeatures.buildconfig=true
android.nonTransitiveRClass=false
android.nonFinalResIds=false
kotlin.jvm.target.validation.mode = IGNORE
